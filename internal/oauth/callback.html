<style>
  /* Matches the Qdrant Cloud login pages (Auth0 Universal Login), without their web font: this page
     makes no requests, so it also renders offline. */
  :root {
    --page: #f2f4f7;
    --grid: #e6eaf5;
    --fg: #111824;
    --muted: #4d5874;
    --tile: #313d4f;
    --ok: #1a7f4b;
    --err: #c62a47;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--fg);
    background-color: var(--page);
    background-size: 80px 80px;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-position: calc(50% - 40.5px) 50px;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
  }
  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 32px 16px;

  }
  .logo { height: 48px; width: auto; margin-bottom: 32px; }
  main {
    width: 100%;
    max-width: 480px;
    padding: 40px 40px 48px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 12px 40px rgba(17, 24, 36, 0.05);
    text-align: center;
  }
  h1 { margin: 0 0 24px; font-size: 2.28rem; font-weight: 600; line-height: 1.4; text-wrap: balance; }
  @media (max-width: 480px) { h1 { font-size: 1.8rem; } main { padding: 32px 24px 40px; } }
  .pair { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 40px; }
  .tile { display: grid; place-items: center; width: 76px; height: 76px; flex: none; }
  .tile.terminal { background: var(--tile); color: #fff; }
  .tile.terminal svg { width: 36px; height: 36px; }
  .tile.qdrant { width: 76px; }
  .tile.qdrant svg { width: 76px; height: auto; }
  .arrows { width: 44px; height: 28px; color: #c3c8d2; flex: none; }
  p { margin: 0 0 12px; line-height: 1.5; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 0; font-weight: 500; }
  .status svg { width: 20px; height: 20px; flex: none; }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
  .detail {
    margin-top: 20px;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--page);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    text-align: left;
    overflow-wrap: anywhere;
  }
</style>
